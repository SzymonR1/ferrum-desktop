[workspace]
resolver = "3"
members = [
    "crates/ferrum-app",
    "crates/ferrum-core",
    "crates/ferrum-engine",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyperlocal = "0.9.1"

[package]
name = "ferrum-app"
description = "Ferrum's native Docker-compatible container manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
ferrum-core = { path = "../ferrum-core", version = "0.1.0" }
ferrum-engine = { path = "../ferrum-engine", version = "0.1.0" }
tokio.workspace = true
rfd = "0.17.2"
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
vt100 = "0.16.2"

[dev-dependencies]
egui_kittest = "0.36.2"
